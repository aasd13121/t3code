name: Follow upstream nightly

# Periodically check pingdotgg/t3code for a new nightly tag. If one exists and
# the fork has not yet published a release for it, merge the tag into task-board
# and dispatch release-fork.yml to build + publish. On merge conflict,
# abort and open an issue for manual resolution.
#
# SCHEDULED runs only fire from the repository's DEFAULT branch. If the default
# is `main`, this workflow must live on `main` (Option A); if you switch the
# default to `task-board`, it fires from there (Option B). Either way it checks
# out task-board for the merge and dispatches release-fork.yml on
# task-board. Manual workflow_dispatch works from any branch that has this file.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, away from the busy hour boundary
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Optional specific upstream nightly tag to follow (e.g. v0.1.11-nightly.20261118.1234). Defaults to the latest.
        required: false
      dry_run:
        description: Validate the merge without pushing or publishing a release.
        type: boolean
        default: false

permissions:
  contents: read # checkout only; the repository deploy key pushes task-board
  actions: write # dispatch release-fork.yml
  issues: write # open an issue on merge conflict

concurrency:
  group: follow-upstream
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-latest
    # A plain merge finishes in about a minute. The repair path installs the server
    # and web dependencies and runs the budget test, so it needs the room.
    timeout-minutes: 30
    if: github.repository_owner != 'pingdotgg'
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: task-board
          fetch-depth: 0
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Clear checkout credential before project code
        shell: bash
        run: |
          set -euo pipefail
          # checkout's cleanup visits malformed reference submodules; remove its isolated token file directly.
          while read -r key file; do
            case "$file" in
              "$RUNNER_TEMP"/git-credentials-*.config) rm -f -- "$file" ;;
            esac
            git config --local --unset-all "$key"
          done < <(git config --local --get-regexp '^includeif\..*\.path$' || true)

      - name: Verify repository sync credential
        if: inputs.dry_run != true
        shell: bash
        env:
          SYNC_SSH_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
        run: |
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo "::error::Configure UPSTREAM_SYNC_SSH_KEY with a write deploy key for this repository."
            exit 1
          fi

      - name: Configure git and upstream remote
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git

      - name: Resolve latest upstream nightly tag
        id: upstream
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.upstream_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          latest="$(git ls-remote --tags upstream 'v*-nightly.*' \
                   | awk -F'refs/tags/' '{print $NF}' \
                   | sed 's/\^{}$//' \
                   | sort -V | tail -1)"
          if [[ -n "$INPUT_TAG" ]]; then
            if [[ "$INPUT_TAG" != "$latest" ]]; then
              echo "::error::Only the latest upstream nightly ($latest) may be published; use dry_run for an older tag."
              if [[ "$DRY_RUN" != true ]]; then exit 1; fi
            fi
            tag="$INPUT_TAG"
          else
            # List upstream nightly tags without fetching, pick the newest by
            # version sort. CI runners are US-based, so direct ls-remote is fast
            # (the ghfast.top proxy is only needed from the user's China link).
            tag="$latest"
          fi
          if [[ -z "$tag" ]]; then
            echo "No upstream nightly tag found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest upstream nightly: $tag ($version)"

      - name: Fetch upstream tag commit
        if: steps.upstream.outputs.skip != 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG" --no-recurse-submodules

      - name: Skip if release already published
        id: dedup
        if: steps.upstream.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # Fork tags carry a -tb suffix (see release-fork.yml), so dedup
          # against the suffixed tag the release job will create.
          if gh release view "v${VERSION}-tb" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION}-tb already published. Up to date."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New upstream nightly to process: v${VERSION}-tb"
          fi

      - name: Merge upstream nightly into task-board
        if: steps.dedup.outputs.skip == 'false'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if git merge --no-edit "$UPSTREAM_TAG"; then
            echo "task-board includes $UPSTREAM_TAG."
            exit 0
          fi
          # Leave the conflicted tree in place; the repair step resolves it or aborts.
          echo "merge_conflict=true" >> "$GITHUB_ENV"
          echo "Merge of $UPSTREAM_TAG into task-board conflicted; attempting automatic repair."

      - name: Setup dependencies for the repair
        if: steps.dedup.outputs.skip == 'false' && env.merge_conflict == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: "--filter=t3... --filter=@t3tools/web..."

      # The fork's extra MCP tools always put its agentContextBudget.json above
      # upstream's, and both sides append keys to the locale catalogs. Both are
      # flat JSON whose union is well defined, so neither needs a person. The
      # script either resolves every conflicted path or aborts the merge.
      - name: Repair known merge conflicts
        if: steps.dedup.outputs.skip == 'false' && env.merge_conflict == 'true'
        shell: bash
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          REPAIR: .github/scripts/resolve-fork-merge-conflicts.cjs
        run: |
          set -euo pipefail
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'Conflicted: %s\n' "${conflicts[@]}"

          catalogs=()
          budget_file=""
          leftovers=()
          for path in "${conflicts[@]}"; do
            case "$path" in
              apps/server/src/provider/agentContextBudget.json) budget_file="$path" ;;
              *"/src/i18n/translations/"*.json) catalogs+=("$path") ;;
              *) leftovers+=("$path") ;;
            esac
          done

          # The budget test fails against a conflicted file and prints the measured
          # values. Conflict markers are not valid JSON, so the file is first cut
          # down to a side: the numbers are replaced by the measurement anyway.
          if [[ -n "$budget_file" ]]; then
            log="$RUNNER_TEMP/budget-test.log"
            measured="$RUNNER_TEMP/measured.json"
            if ! node "$REPAIR" --clear-budget "$budget_file"; then
              leftovers+=("$budget_file")
            else
              (cd apps/server && vp test run src/provider/AgentContextBudget.test.ts) > "$log" 2>&1 || true
              if ! node "$REPAIR" --measured "$log" > "$measured"; then
                echo "The budget test did not report measured values."
                leftovers+=("$budget_file")
              elif ! node "$REPAIR" --budget "$budget_file" "$measured"; then
                leftovers+=("$budget_file")
              fi
            fi
          fi

          if [[ "${#catalogs[@]}" -gt 0 ]]; then
            if ! node "$REPAIR" --translate "${catalogs[@]}"; then
              leftovers+=("${catalogs[@]}")
            fi
          fi

          if [[ "${#leftovers[@]}" -gt 0 ]]; then
            echo "::error::Merge of $UPSTREAM_TAG needs manual resolution: ${leftovers[*]}"
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          # The repaired budget must match what the merged tree measures.
          (cd apps/server && vp test run src/provider/AgentContextBudget.test.ts)
          # A repair must not drop a translation the source catalog still has.
          node "$REPAIR" --check-catalogs

          git add -A
          git commit --no-edit --no-verify
          # Cleared so the push and release dispatch below run as they do after a
          # clean merge; the issue step keys off the same flag.
          echo "merge_conflict=false" >> "$GITHUB_ENV"
          echo "task-board includes $UPSTREAM_TAG (auto-resolved)."

      - name: Push merged task-board
        if: steps.dedup.outputs.skip == 'false' && env.merge_conflict != 'true' && inputs.dry_run != true
        shell: bash
        env:
          SYNC_SSH_KEY: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key="$(mktemp "$RUNNER_TEMP/upstream-key.XXXXXX")"
          hosts="$(mktemp "$RUNNER_TEMP/upstream-hosts.XXXXXX")"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SYNC_SSH_KEY" > "$key"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$hosts"
          export GIT_SSH_COMMAND="ssh -i \"$key\" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=\"$hosts\""
          git push "git@github.com:$GITHUB_REPOSITORY.git" HEAD:refs/heads/task-board

      - name: Dispatch release-fork workflow
        if: steps.dedup.outputs.skip == 'false' && env.merge_conflict != 'true' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          # gh resolves the repo from git remotes when --repo is omitted, and it
          # prefers a remote named "upstream" over "origin" — this job adds
          # upstream=pingdotgg/t3code, so every gh call MUST pin
          # --repo "$GITHUB_REPOSITORY" or it would target the upstream repo.
          # release-fork.yml appends the -tb suffix to the version it receives.
          gh workflow run release-fork.yml --ref task-board -f version="$VERSION" --repo "$GITHUB_REPOSITORY"
          echo "Dispatched release-fork.yml on task-board for v${VERSION}-tb."

      - name: Open issue on merge conflict
        if: failure() && env.merge_conflict == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          title="Auto-follow upstream: merge conflict for $UPSTREAM_TAG"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $UPSTREAM_TAG" --json number --jq '.[0].number' 2>/dev/null || true)"
          body="Automatic merge of upstream nightly \`$UPSTREAM_TAG\` into \`task-board\` (version \`$VERSION\`) conflicted and could not be completed automatically.

          Resolve the conflict locally:
          \`\`\`
          git fetch upstream refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG
          git switch task-board
          git merge $UPSTREAM_TAG
          # resolve conflicts, then:
          git commit
          git push origin task-board
          \`\`\`
          Then re-run this workflow or dispatch \`release-fork.yml\` with version \`$VERSION\` (release tag will be \`v${VERSION}-tb\`).

          Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -z "$existing" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label "auto-follow-conflict" 2>/dev/null || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still conflicting on $UPSTREAM_TAG. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
