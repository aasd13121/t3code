name: Release fork desktop

# Fork build of T3 Code (task-board branch) that produces an UNSIGNED Windows
# NSIS installer and publishes it to GitHub Releases, so other PCs can download
# and install it directly.
#
# wsl-runtime is built from fork source on a Linux job (no dependency on any
# upstream release asset). The Windows NSIS is built natively on windows-latest,
# matching the proven local build. The single `version` drives both jobs, so the
# wsl-runtime archive's internal directory (t3-<version>-linux-x64) matches the
# NSIS build version that validateWindowsPackagedPayload checks against.
#
# Trigger: push a tag `v<version>` (e.g. v0.1.11-taskboard.1), or run via
# workflow_dispatch with a `version` input (no leading v). The installer is
# unsigned; Windows SmartScreen will warn on first launch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 0.1.11-taskboard.1 (no leading v)
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

env:
  # Install only desktop/server/scripts and their deps; avoids the mobile
  # clients whose GitHub asset downloads stall the install.
  INSTALL_FILTERS: "--filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts..."
  # Fork is not pingdotgg/t3code; telemetry reports "dev" like upstream's own
  # gating does for non-pingdotgg repos.
  T3CODE_TELEMETRY_CHANNEL: dev

# Serialize releases so the pointer check and update cannot race across versions.
concurrency:
  group: release-fork-nightly
  cancel-in-progress: false

jobs:
  wsl-runtime:
    name: Build wsl-runtime (Linux CLI archive)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_VERSION" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Fork -tb suffix: distinguish fork builds from upstream at the same
          # version; as a prerelease id it sorts higher than upstream so
          # electron-updater offers the fork build. Guard avoids double-append.
          [[ "$VERSION" =~ -tb(\.[1-9][0-9]*)?$ ]] || VERSION="$VERSION-tb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_FILTERS }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # patchelf + libatomic1: the Linux CLI archive bundles libatomic.so.1 and
      # rewrites t3's RUNPATH at it (see bundleLinuxLibatomic). libsecret-dev is
      # a precaution in case build:desktop compiles the Linux browser secret
      # helper on this host.
      - name: Install Linux build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libatomic1 libsecret-1-dev pkg-config

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "$VERSION"

      # T3 Connect (relay + Clerk) identifiers are baked into the JS bundle at
      # build time by apps/server/vite.config.ts and apps/web/vite.config.ts.
      # Upstream's release.yml reads them from production repository variables;
      # the fork defines none, which left them empty and compiled T3 Connect
      # out (hasCloudPublicConfig=false hides the settings row and `t3 connect`).
      # .env.example ships the same public identifiers official builds use and
      # is tracked, so read them from there: one source of truth, no secrets.
      - name: Load T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            T3CODE_CLERK_PUBLISHABLE_KEY \
            T3CODE_CLERK_JWT_TEMPLATE \
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID \
            T3CODE_RELAY_URL
          do
            value="$(sed -n "s|^${key}=||p" .env.example | head -n1)"
            if [[ -z "$value" ]]; then
              echo "::error::.env.example is missing ${key}, so T3 Connect would be built out."
              exit 1
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "T3 Connect config: ${key} is set"
          done

      # Produces apps/server/dist (server bundle + web client). Mirrors the local
      # build, which runs build:desktop through build-desktop-artifact.ts.
      - name: Build JS bundle
        shell: bash
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: vp run build:desktop

      - name: Apply web client branding
        shell: bash
        run: |
          brand=production
          if [[ "$VERSION" =~ -nightly\.[0-9]{8}\.[0-9]+-tb(\.[1-9][0-9]*)?$ ]]; then brand=nightly; fi
          node scripts/apply-web-brand-assets.ts "$brand" apps/server/dist/client

      - name: Build CLI single-executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose

      - name: Build resource monitor
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Stage resource monitor for CLI archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor \
             "$RUNNER_TEMP/cli-resource-monitor/linux-x64/t3-resource-monitor"

      - name: Build CLI archive
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/stage-pnpm/cache
          pnpm_config_store_dir: ${{ runner.temp }}/stage-pnpm/store
          pnpm_config_prefer_offline: "true"
        run: |
          node scripts/build-cli-archive.ts \
            --platform linux \
            --arch x64 \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-linux-x64
          path: release-cli/*
          if-no-files-found: error
          # Already gzip; deflating again saves under 2%.
          compression-level: 0

  windows-nsis:
    name: Build Windows NSIS
    needs: [wsl-runtime]
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - name: Resolve version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_VERSION" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Fork -tb suffix: distinguish fork builds from upstream at the same
          # version; as a prerelease id it sorts higher than upstream so
          # electron-updater offers the fork build. Guard avoids double-append.
          [[ "$VERSION" =~ -tb(\.[1-9][0-9]*)?$ ]] || VERSION="$VERSION-tb"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.INSTALL_FILTERS }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Pre-build the resource monitor with the host's MSVC toolchain, then set
      # T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR=true so build-desktop-artifact.ts
      # reuses this binary and SKIPS its Rust + VS/Spectre preflight (the
      # Spectre-mitigated libraries are not on the default windows-latest image).
      - name: Build resource monitor
        shell: bash
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Download wsl-runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: wsl-runtime

      # Same source as the Linux job: the tracked public identifiers in
      # .env.example, which build-desktop-artifact.ts passes through to the
      # bundle build it runs (it extends the environment). See that job for why.
      - name: Load T3 Connect public config
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            T3CODE_CLERK_PUBLISHABLE_KEY \
            T3CODE_CLERK_JWT_TEMPLATE \
            T3CODE_CLERK_CLI_OAUTH_CLIENT_ID \
            T3CODE_RELAY_URL
          do
            value="$(sed -n "s|^${key}=||p" .env.example | head -n1)"
            if [[ -z "$value" ]]; then
              echo "::error::.env.example is missing ${key}, so T3 Connect would be built out."
              exit 1
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "T3 Connect config: ${key} is set"
          done

      # No --skip-build: build-desktop-artifact.ts builds the JS bundle itself
      # (vp run build:desktop with version alignment + restore), reuses the
      # pre-built resource monitor (REUSE=true), and embeds the wsl-runtime
      # archive produced by the Linux job.
      - name: Build desktop NSIS
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
          pnpm_config_cache_dir: ${{ runner.temp }}/stage-pnpm/cache
          pnpm_config_store_dir: ${{ runner.temp }}/stage-pnpm/store
          pnpm_config_prefer_offline: "true"
        run: |
          node scripts/build-desktop-artifact.ts \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "$VERSION" \
            --wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-x64.tar.gz \
            --verbose

      - name: Publish to GitHub Releases
        shell: bash
        env:
          # Release targets include workflow updates, which GITHUB_TOKEN cannot publish.
          GH_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          exe=(release/*.exe)
          if [[ ${#exe[@]} -eq 0 ]]; then
            echo "::error::No NSIS installer found in release/"
            exit 1
          fi
          # electron-updater resolves an update by downloading the channel
          # manifest from the release. With the nightly publish config (set in
          # CI via GITHUB_REPOSITORY), electron-builder emits nightly.yml next
          # to the exe; latest.yml is included as a fallback. builder-debug.yml
          # is deliberately excluded to keep the release clean.
          yml=()
          for candidate in release/nightly.yml release/latest.yml; do
            if [[ -f "$candidate" ]]; then
              yml+=("$candidate")
            fi
          done
          if [[ ${#yml[@]} -eq 0 ]]; then
            echo "::error::No update manifest (nightly.yml/latest.yml) in release/. The fork auto-update loop cannot work without it; confirm build-desktop-artifact.ts resolved a GitHub publish config (GITHUB_REPOSITORY must be set on the runner)."
            exit 1
          fi
          assets=("${exe[@]}" "${yml[@]}")
          tag="v$VERSION"
          # Release notes must describe what this build actually changed, not a
          # fixed template line every time. The commit behind the build is that
          # change; fall back to the version if the API call fails.
          change="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.message' 2>/dev/null | head -20 || true)"
          [ -n "$change" ] || change="Release $VERSION"
          printf -v notes 'Fork build of T3 Code (task-board). Changes in this build:\n\n%s\n\nUnsigned Windows NSIS installer. SmartScreen will warn on first launch.' "$change"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes "$notes" >/dev/null
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$VERSION" \
              --notes "$notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "Published $tag with: ${assets[*]}"

      # electron-updater is patched to read releases/download/update-feed/<channel>.json
      # and prefer it over releases.atom, whose top 10 tags (any kind) can be dominated
      # by other tags and hide the newest nightly. Without a pointer, an older tag at the
      # top of the feed makes installs report "no update". Record this release as the
      # nightly pointer: the full release object so releaseName/body/assets resolve.
      - name: Update nightly channel pointer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FORK_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > nightly.json
          if gh release view update-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current_dir="$(mktemp -d "$RUNNER_TEMP/current-feed.XXXXXX")"
            gh release download update-feed --repo "$GITHUB_REPOSITORY" --pattern nightly.json --dir "$current_dir"
            current_tag="$(jq -er '.tag_name' "$current_dir/nightly.json")"
            advance="$(node .github/scripts/fork-release-guard.cjs "$tag" "$current_tag")"
            if [[ "$advance" != true ]]; then
              echo "Keeping $current_tag: $tag would downgrade the nightly channel."
              exit 0
            fi
            gh release upload update-feed nightly.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create update-feed --repo "$GITHUB_REPOSITORY" \
              --title "update-feed" \
              --notes "Rolling pointer for the fork nightly auto-update feed. Do not delete." \
              --target "$GITHUB_SHA"
            gh release upload update-feed nightly.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
          echo "update-feed/nightly.json -> $tag"
